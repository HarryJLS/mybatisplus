name: Build and release plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-aarch64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test native engine
        run: cargo test --locked --manifest-path native/Cargo.toml
      - name: Test and build plugin (IDEA 2026.1.4)
        run: bash ./gradlew --no-daemon -PideaVersion=2026.1.4 coreTest buildPlugin
      - name: Verify intermediate platform build
        run: python scripts/prepare_ci_artifact.py --platform '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        with:
          name: platform-build-${{ matrix.platform }}
          path: build/ci-artifacts/*
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Assemble universal plugin ZIP
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: platform-build-*
          path: build/platform-inputs
      - name: Combine and verify all native libraries
        run: python scripts/assemble_universal_plugin.py --input-dir build/platform-inputs
      - uses: actions/upload-artifact@v4
        with:
          name: mybatis-assistant
          path: build/universal-artifacts/*
          if-no-files-found: error
          retention-days: 30

  native-smoke:
    name: Test plugin ZIP (${{ matrix.os }})
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: mybatis-assistant
          path: build/universal-artifacts
      - name: Load native engine from final installable ZIP
        run: |
          python scripts/test_plugin_native.py build/universal-artifacts/mybatis-assistant-*.zip --universal

  release:
    name: Publish plugin installation ZIP
    needs: native-smoke
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: plugin-releases
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mybatis-assistant
          path: build/release-assets
      - name: Publish universal plugin ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/publish_ci_release.py
