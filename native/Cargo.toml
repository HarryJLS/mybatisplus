[package]
name = "mybatis-assistant-engine"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "mybatis_engine"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mybatis-engine"
path = "src/main.rs"

[dependencies]
jni = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
